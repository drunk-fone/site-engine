<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Site-Engine – Lean, secure and modern eCommerce storefront.">
  <link rel="icon" href="img/favicon.svg?v=2" type="image/svg+xml">
  <title>Site-Engine Store</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.5; padding-bottom: 80px; }
    header { background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
    .nav { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem; }
    .brand { font-size: 1.25rem; font-weight: 700; color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 0.5rem; }
    .brand img { width: 28px; height: 28px; }
    .cart-btn { background: var(--primary); color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 9999px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; }
    .cart-btn:hover { background: var(--primary-hover); }
    .badge { background: #fff; color: var(--primary); padding: 0.1rem 0.5rem; border-radius: 9999px; font-size: 0.85rem; font-weight: 700; }

    .hero { max-width: 1100px; margin: 3rem auto; padding: 0 1.5rem; text-align: center; }
    .hero h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 0.75rem; letter-spacing: -0.02em; }
    .hero p { font-size: 1.15rem; color: var(--text-muted); max-width: 600px; margin: 0 auto 1.5rem; }

    .container { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; transition: transform 0.15s, box-shadow 0.15s; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
    .card img { width: 100%; height: 220px; object-fit: cover; background: #f1f5f9; }
    .card-body { padding: 1.25rem; display: flex; flex-direction: column; flex: 1; }
    .card-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.25rem; }
    .card-desc { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem; flex: 1; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border); }
    .price { font-size: 1.25rem; font-weight: 700; color: var(--text); }
    .add-btn { background: var(--primary); color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .add-btn:hover { background: var(--primary-hover); }

    /* Modal / Drawer */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; display: none; align-items: center; justify-content: center; padding: 1rem; }
    .modal-backdrop.open { display: flex; }
    .modal { background: #fff; width: 100%; max-width: 520px; border-radius: var(--radius); padding: 1.5rem; max-height: 90vh; overflow-y: auto; position: relative; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; }
    .modal-title { font-size: 1.25rem; font-weight: 700; }
    .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 0; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
    .form-group { margin-bottom: 0.75rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.25rem; color: var(--text-muted); }
    .form-control { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 0.95rem; }
    .btn-submit { width: 100%; background: #16a34a; color: #fff; border: none; padding: 0.75rem; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 1rem; }
    .btn-submit:hover { background: #15803d; }
    .notice { padding: 0.75rem; background: #f0fdf4; color: #166534; border-radius: 6px; font-size: 0.85rem; margin-top: 0.5rem; text-align: center; }

    footer { text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 2rem 1.5rem; border-top: 1px solid var(--border); margin-top: 3rem; }
  </style>

  <!-- Default Fallback Catalog JSON -->
  <script id="produkte" type="application/json">
  {
    "versand": { "preis": 7, "gratis_ab_betrag": 50 },
    "motive": ["Design Classic", "Design Modern", "Design Minimal"],
    "produkte": [
      { "id": "starter-set", "name": "Starter Set", "groesse": "Complete Kit", "preis": 39, "motive": 1, "set": true },
      { "id": "single-item", "name": "Standard Item", "groesse": "Standard", "preis": 19, "motive": 1 },
      { "id": "accessory-pack", "name": "Accessory Pack", "groesse": "3-Pack", "preis": 9, "motive": 0 }
    ]
  }
  </script>
</head>
<body>
  <header>
    <div class="nav">
      <a href="/" class="brand">
        <img src="img/logo.svg" alt="Logo">
        <span id="brand-name">Site-Engine Store</span>
      </a>
      <button class="cart-btn" onclick="openCart()">
        Warenkorb <span class="badge" id="cart-count">0</span>
      </button>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1 id="hero-title">Willkommen im Shop</h1>
      <p id="hero-tagline">Schlanker, moderner und sicherer Webshop auf Basis von Site-Engine.</p>
    </section>

    <div class="container">
      <div class="grid" id="product-grid">
        <!-- Dynamisch aus dem Katalog geladen -->
      </div>
    </div>
  </main>

  <!-- Warenkorb & Checkout Modal -->
  <div class="modal-backdrop" id="cart-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Warenkorb & Kasse</h3>
        <button class="close-btn" onclick="closeCart()">&times;</button>
      </div>

      <div id="cart-items">
        <p style="color:var(--text-muted); text-align:center; padding: 1rem 0;">Dein Warenkorb ist leer.</p>
      </div>

      <div id="checkout-form" style="display:none; margin-top: 1.5rem; border-top: 2px dashed var(--border); padding-top: 1rem;">
        <h4 style="margin-bottom: 0.75rem;">Lieferadresse</h4>
        <!-- Honeypot -->
        <input type="text" id="cust-website" style="display:none;" tabindex="-1" autocomplete="off">

        <div class="form-group">
          <label>Vor- und Nachname *</label>
          <input type="text" id="cust-name" class="form-control" placeholder="Max Muster" required>
        </div>
        <div class="form-group">
          <label>Strasse & Hausnummer *</label>
          <input type="text" id="cust-adresse" class="form-control" placeholder="Mustergasse 1" required>
        </div>
        <div class="form-group">
          <label>PLZ & Ort *</label>
          <input type="text" id="cust-plz" class="form-control" placeholder="8000 Zürich" required>
        </div>
        <div class="form-group">
          <label>E-Mail-Adresse *</label>
          <input type="email" id="cust-email" class="form-control" placeholder="max@example.com" required>
        </div>
        <div class="form-group">
          <label>Telefon (optional)</label>
          <input type="tel" id="cust-phone" class="form-control" placeholder="+41 79 000 00 00">
        </div>
        <div class="form-group">
          <label>Bemerkung (optional)</label>
          <textarea id="cust-msg" class="form-control" rows="2" placeholder="Wünsche oder Hinweise..."></textarea>
        </div>
        <div class="form-group">
          <label>Zahlungsmethode</label>
          <select id="cust-pay" class="form-control">
            <option value="Rechnung">Rechnung</option>
            <option value="Twint">Twint</option>
          </select>
        </div>

        <button class="btn-submit" id="submit-btn" onclick="submitOrder()">Kostenpflichtig bestellen</button>
        <div class="notice">🔒 Keine Kreditkarte nötig. Zahlung erfolgt nach Erhalt per Rechnung/Twint.</div>
      </div>
    </div>
  </div>

  <footer>
    <p id="footer-text">&copy; 2026 Site-Engine. Betrieben mit Kubernetes & GitOps.</p>
  </footer>

  <script>
    var CART = [];
    var CATALOG = JSON.parse(document.getElementById("produkte").textContent);

    // Konfiguration vom Server abfragen (falls dynamisch geladen)
    fetch('/api/config')
      .then(r => r.ok ? r.json() : CATALOG)
      .then(cfg => {
        if (cfg && cfg.produkte) {
          CATALOG = cfg;
          if (cfg.shop_name) {
            document.getElementById("brand-name").textContent = cfg.shop_name;
            document.getElementById("hero-title").textContent = cfg.shop_name;
          }
          if (cfg.shop_tagline) {
            document.getElementById("hero-tagline").textContent = cfg.shop_tagline;
          }
          renderProducts();
        }
      })
      .catch(() => renderProducts());

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderProducts() {
      var grid = document.getElementById("product-grid");
      grid.innerHTML = "";
      var curr = CATALOG.currency || "CHF";
      (CATALOG.produkte || []).forEach(p => {
        var card = document.createElement("div");
        card.className = "card";
        var motiveSelect = "";
        if (p.motive && p.motive > 0 && CATALOG.motive) {
          motiveSelect = `<select id="motive-${escapeHtml(p.id)}" class="form-control" style="margin-bottom:0.75rem;">` +
            CATALOG.motive.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join("") +
            `</select>`;
        }
        card.innerHTML = `
          <img src="img/placeholder.svg" alt="${escapeHtml(p.name)}">
          <div class="card-body">
            <h3 class="card-title">${escapeHtml(p.name)}</h3>
            <p class="card-desc">${escapeHtml(p.groesse || 'Standard-Ausführung')}</p>
            ${motiveSelect}
            <div class="card-footer">
              <span class="price">${escapeHtml(curr)} ${p.preis.toFixed(2)}</span>
              <button class="add-btn">+ Hinzufügen</button>
            </div>
          </div>
        `;
        card.querySelector(".add-btn").addEventListener("click", () => addToCart(p.id));
        grid.appendChild(card);
      });
    }

    function addToCart(pid) {
      var prod = (CATALOG.produkte || []).find(p => p.id === pid);
      if (!prod) return;
      var motive = [];
      var mEl = document.getElementById("motive-" + pid);
      if (mEl) motive.push(mEl.value);

      var existing = CART.find(item => item.id === pid && JSON.stringify(item.motive) === JSON.stringify(motive));
      if (existing) {
        existing.qty++;
      } else {
        CART.push({ id: pid, name: prod.name, preis: prod.preis, groesse: prod.groesse, qty: 1, motive: motive });
      }
      updateCartBadge();
      openCart();
    }

    function updateCartBadge() {
      var count = CART.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById("cart-count").textContent = count;
    }

    function openCart() {
      renderCartItems();
      document.getElementById("cart-modal").classList.add("open");
    }

    function closeCart() {
      document.getElementById("cart-modal").classList.remove("open");
    }

    function renderCartItems() {
      var container = document.getElementById("cart-items");
      var form = document.getElementById("checkout-form");
      var curr = CATALOG.currency || "CHF";
      if (CART.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted); text-align:center; padding: 1rem 0;">Dein Warenkorb ist leer.</p>';
        form.style.display = "none";
        return;
      }
      form.style.display = "block";
      var subtotal = 0;
      var html = "";
      CART.forEach((item, idx) => {
        var total = item.preis * item.qty;
        subtotal += total;
        var safeName = escapeHtml(item.name);
        var mStr = item.motive && item.motive.length ? ` <small style="color:var(--text-muted)">(${escapeHtml(item.motive.join(', '))})</small>` : '';
        html += `
          <div class="cart-item">
            <div>
              <strong>${safeName}</strong>${mStr}<br>
              <small>${item.qty} × ${escapeHtml(curr)} ${item.preis.toFixed(2)}</small>
            </div>
            <div>
              <strong>${escapeHtml(curr)} ${total.toFixed(2)}</strong>
              <button onclick="removeItem(${idx})" style="background:none;border:none;color:#ef4444;margin-left:0.5rem;cursor:pointer;">&times;</button>
            </div>
          </div>
        `;
      });

      var vRule = CATALOG.versand || { preis: 0, gratis_ab_betrag: 0 };
      var shipping = subtotal >= vRule.gratis_ab_betrag ? 0 : vRule.preis;
      var total = subtotal + shipping;

      html += `
        <div style="margin-top: 1rem; text-align: right; font-size: 0.95rem;">
          <div>Zwischensumme: <strong>${curr} ${subtotal.toFixed(2)}</strong></div>
          <div>Versand: <strong>${shipping === 0 ? 'Gratis' : curr + ' ' + shipping.toFixed(2)}</strong></div>
          <div style="font-size: 1.15rem; margin-top: 0.5rem;">Gesamttotal: <strong>${curr} ${total.toFixed(2)}</strong></div>
        </div>
      `;
      container.innerHTML = html;
    }

    function removeItem(idx) {
      CART.splice(idx, 1);
      updateCartBadge();
      renderCartItems();
    }

    function submitOrder() {
      var btn = document.getElementById("submit-btn");
      var name = document.getElementById("cust-name").value.trim();
      var adresse = document.getElementById("cust-adresse").value.trim();
      var plz = document.getElementById("cust-plz").value.trim();
      var email = document.getElementById("cust-email").value.trim();
      var phone = document.getElementById("cust-phone").value.trim();
      var msg = document.getElementById("cust-msg").value.trim();
      var pay = document.getElementById("cust-pay").value;
      var website = document.getElementById("cust-website").value; // Honeypot

      if (!name || !adresse || !plz || !email) {
        alert("Bitte fülle alle Pflichtfelder (Name, Adresse, PLZ/Ort, E-Mail) aus.");
        return;
      }

      var payload = {
        website: website,
        kunde: { name: name, adresse: adresse, plz_ort: plz, email: email, telefon: phone },
        positionen: CART.map(i => ({ id: i.id, qty: i.qty, motive: i.motive })),
        nachricht: msg,
        zahlung: pay
      };

      btn.disabled = true;
      btn.textContent = "Wird übermittelt...";

      fetch("/api/bestellung", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(r => r.json().then(data => ({ ok: r.ok, data: data })))
      .then(res => {
        if (!res.ok) {
          throw new Error(res.data.error || "Fehler beim Absenden.");
        }
        CART = [];
        updateCartBadge();
        document.getElementById("cart-items").innerHTML = `
          <div style="text-align:center; padding: 2rem 0;">
            <div style="font-size: 3rem; margin-bottom: 0.5rem;">🎉</div>
            <h3>Vielen Dank für deine Bestellung!</h3>
            <p style="margin: 0.75rem 0; color:var(--text-muted);">Deine Bestellnummer: <strong id="conf-nr"></strong></p>
            <p style="font-size:0.9rem;">Eine Bestätigung wurde an <strong id="conf-email"></strong> gesendet.</p>
          </div>
        `;
        document.getElementById("conf-nr").textContent = res.data.bestellnummer;
        document.getElementById("conf-email").textContent = email;
        document.getElementById("checkout-form").style.display = "none";
      })
      .catch(err => {
        alert("Fehler: " + err.message);
        btn.disabled = false;
        btn.textContent = "Kostenpflichtig bestellen";
      });
    }
  </script>
</body>
</html>
