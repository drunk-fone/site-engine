<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Anmelden · Administration</title>
  <script src="/admin/theme.js"></script>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body data-page="login">
  <div class="narrow">
    <div class="card">
      <h2>🔐 Administration</h2>
      <div id="setup-needed" class="notice" hidden>
        <p style="margin-top:0"><b>Es ist noch kein Admin-Passwort gesetzt.</b></p>
        <p>Beim Start hat der Server einen <b>Einrichtungs-Link</b> (24 h gültig) ins Log geschrieben.
          In Argo CD: <i>App öffnen → Pod anklicken → Logs</i>, dann den Link öffnen.</p>
        <p>Abgelaufen oder nicht mehr im Log? Hier einen neuen erzeugen:</p>
        <button class="btn" type="button" id="new-link" style="justify-content:center">Neuen Einrichtungs-Link erzeugen</button>
        <p id="new-link-msg" class="sub" hidden></p>
      </div>
      <form id="login-form" class="stack" autocomplete="on">
        <label><span>Passwort</span><input type="password" id="passwort" autocomplete="current-password" required></label>
        <label id="code-row" hidden><span>Code aus der Authenticator-App</span>
          <input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7"></label>
        <p id="error" class="notice err" hidden></p>
        <button class="btn primary" type="submit" id="submit" style="justify-content:center">Anmelden</button>
        <button class="btn" type="button" id="forgot" style="justify-content:center;border-color:var(--line)">Passwort vergessen?</button>
        <p id="forgot-msg" class="notice" hidden></p>
      </form>
    </div>
  </div>
  <script src="/admin/auth.js"></script>
</body>
</html>
