<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Anmelden · Administration</title>
  <script src="/admin/theme.js"></script>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body data-page="login">
  <div class="narrow">
    <div class="card stack">
      <h2>🔐 Administration</h2>
      <div id="not-configured" class="notice" hidden>
        <p style="margin-top:0"><b>Die Google-Anmeldung ist noch nicht eingerichtet.</b></p>
        <p style="margin-bottom:0">In der ConfigMap der Seite <code>GOOGLE_CLIENT_ID</code> und <code>ADMIN_EMAILS</code> setzen
          (siehe README). Danach erscheint hier der Google-Button.</p>
      </div>
      <div id="google-area" hidden>
        <p class="sub" style="margin:0 0 12px">Melde dich mit einem freigegebenen Google-Konto an.</p>
        <div id="google-btn" style="min-height:44px;display:flex;justify-content:center"></div>
      </div>
      <p id="error" class="notice err" hidden></p>
      <details id="notfall">
        <summary>Google funktioniert nicht? Notfall-Code verwenden</summary>
        <form id="notfall-form" class="stack" style="margin-top:12px">
          <label><span>Notfall-Code (z. B. aus Vaultwarden)</span>
            <input type="text" id="code" autocomplete="one-time-code" spellcheck="false" placeholder="ABCD-EFGH-IJKL-MNOP" maxlength="40"></label>
          <button class="btn" type="submit" id="notfall-submit" style="justify-content:center">Mit Notfall-Code anmelden</button>
        </form>
      </details>
    </div>
  </div>
  <script src="/admin/auth.js"></script>
  <script src="https://accounts.google.com/gsi/client" async></script>
</body>
</html>
