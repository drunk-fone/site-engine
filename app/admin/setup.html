<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Notfall-Zugang · Administration</title>
  <script src="/admin/theme.js"></script>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body data-page="setup">
  <div class="narrow">
    <div class="card">
      <h2>🛟 Notfall-Zugang</h2>
      <p class="sub">Dieser Link funktioniert genau einmal und öffnet direkt eine Admin-Sitzung. Prüfe danach unter
        <i>Einstellungen → Anmeldung</i> die Google-Einrichtung und erzeuge Notfall-Codes.</p>
      <form id="setup-form" class="stack">
        <label id="token-row"><span>Einmal-Code (Teil nach <code>#</code> im Link)</span><input type="text" id="token" autocomplete="off"></label>
        <p id="error" class="notice err" hidden></p>
        <button class="btn primary" type="submit" id="submit" style="justify-content:center">Anmelden</button>
      </form>
    </div>
  </div>
  <script src="/admin/auth.js"></script>
</body>
</html>
